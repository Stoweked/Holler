  /quickbooks/callback:
    get:
      operationId: QuickBooksCallback
      summary: Handle QuickBooks OAuth2 callback
      description: |
        Handles the Intuit OAuth2 redirect. On success, stores the connection and redirects
        to `<frontendBaseURL>/settings?qb_connected=true`. On failure, redirects to
        `<frontendBaseURL>/settings?qb_error=<code>`.

        This endpoint is in the auth allowlist — no JWT is required because it is
        invoked by a browser redirect from Intuit, not by an authenticated API client.
        The account is recovered from the CSRF state token, not from a path parameter.
      tags:
        - QuickBooks
      parameters:
        - name: error
          in: query
          schema:
            type: string
          description: Error code returned by Intuit (present when user denies consent)
        - name: code
          in: query
          schema:
            type: string
          description: Authorization code from Intuit
        - name: state
          in: query
          schema:
            type: string
          description: CSRF state token created by the connect endpoint
        - name: realmId
          in: query
          schema:
            type: string
          description: QuickBooks company/realm ID
      responses:
        '302':
          description: Redirect to frontend with success or error query params

  /quickbooks/{accountId}/connect:
    get:
      operationId: QuickBooksConnect
      summary: Initiate QuickBooks OAuth2 connection
      description: |
        Creates a CSRF state token and issues a 302 redirect to the Intuit authorization URL.

        **Full OAuth2 flow:**
        1. Frontend navigates the browser to this endpoint.
        2. Server redirects to Intuit's authorization page.
        3. User grants (or denies) consent on Intuit's site.
        4. Intuit redirects the browser to `/api/v1/quickbooks/callback`.
        5. On success, the server stores the connection and redirects to `<frontendBaseURL>/settings?qb_connected=true`.
        6. On failure, the server redirects to `<frontendBaseURL>/settings?qb_error=<code>`.

        **Possible `qb_error` codes the frontend may receive:**
        - `access_denied` — user cancelled or denied consent on Intuit's page
        - `state_expired` — the CSRF state token expired before the user completed the flow (>10 min); prompt to retry
        - `invalid_state` — state token was not found or already used
        - `invalid_callback` — the callback was missing required parameters
        - `token_exchange_failed` — Intuit rejected the authorization code exchange
        - `store_failed` — tokens were exchanged successfully but could not be saved
        - `integration_disabled` — QuickBooks is not configured on this server
        - `intuit_error` — Intuit returned an unrecognised error; see Intuit's OAuth2 docs
      tags:
        - QuickBooks
      parameters:
        - $ref: '#/components/parameters/QuickBooksAccountIDPath'
      responses:
        '302':
          description: Redirect to Intuit authorization page
        '404':
          description: Account not found or user does not have access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: QuickBooks integration not enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /quickbooks/{accountId}/status:
    get:
      operationId: QuickBooksStatus
      summary: Get QuickBooks connection status for an account
      description: Returns whether the account has an active QuickBooks connection. Includes refresh token expiry so the frontend can warn the user before re-auth is required.
      tags:
